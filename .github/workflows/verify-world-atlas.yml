name: Verify Town Forge interiors
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-world-atlas.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: townforge-interior-final-browser
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ringshark/townforge-source
          ref: a545a5b50a3a712483b28a32f74d0079bc718432
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: interior-candidate-site
          run-id: 40279446264
          github-token: ${{ github.token }}
          path: source/site
      - name: Confirm compiled game matches reviewed source
        working-directory: source
        run: |
          test "$(cat site/source-version.txt)" = "96f8e3bd340f0c84170914088ef7c8c1ee58bc8e"
          test "$(git rev-parse HEAD:main.cpp)" = "2e4aae3ef42c65f67e579d5f08388cc765243da7"
      - name: Verify desktop and phone rendering
        working-directory: source
        run: |
          npm install --prefix /tmp/tf-browser playwright pngjs
          /tmp/tf-browser/node_modules/.bin/playwright install --with-deps chromium webkit
          python3 -m http.server 8765 --directory site > /tmp/tf-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          # This save only disables online play and the tutorial; entry is through real town controls.
          printf 'version=1\ncharacterName=Interior QA\noptOnline=0\nstarter=-1 1 1\n' > /tmp/tf-interior-fixture.txt
          NODE_PATH=/tmp/tf-browser/node_modules node tests/interior-web.cjs
          TF_BROWSER=webkit NODE_PATH=/tmp/tf-browser/node_modules node tests/atlas-web.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: townforge-2d-browser-checks
          path: source/browser-checks
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: interior-validated-site
          path: source/site
          retention-days: 3

# Compact interiors and framed-matte release: 13d4b9288f88195eece091a6c20dfb80e2b73a6c
# Cohesive 2D environment release: 82a1adc23c922bae681d433c32327c1a4f0962cd
# Dungeon landscape camera release: ce2e95d781736179ab72c1c8df00705695fcc4b8
name: Build and publish Town Forge 2D
on:
  push:
    branches: [main]
    paths: ['.github/workflows/townforge-2d.yml']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: townforge-2d-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: current-site
      - uses: actions/checkout@v4
        with:
          repository: ringshark/townforge-source
          ref: ringshark-patch-1
          path: source
      - name: Check published source
        id: changed
        run: |
          sha=$(git -C source rev-parse HEAD)
          deployed=$(curl --fail --silent https://ringshark.github.io/townforge/source-version.txt || true)
          if [ "$sha" != "$deployed" ] || [ '${{ github.event_name }}' = 'push' ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: mymindstorm/setup-emsdk@v14
        if: steps.changed.outputs.build == 'true'
        with:
          version: '4.0.20'
          actions-cache-folder: emsdk-cache
      - name: Check input, navigation and game state
        if: steps.changed.outputs.build == 'true'
        working-directory: source
        run: |
          node tests/build-variants.cjs
          node tests/landscape-shell.cjs
          node tests/guildnet-hub.cjs
          node tests/guildnet-refresh.cjs
          node tests/guild-project.cjs
          node tests/guild-city-cloud.cjs
          node tests/den-client.cjs
          python tests/guild-parser.py
          python tests/landscape-pointer.py
          python tests/transitions.py
          python tests/player-movement.py
          python tests/ui-input.py
          python tests/menu-scroll.py
          python tests/mobile-combat.py
          python tests/menu-status.py
          node server/mp/test/den.mjs
          node server/mp/test/ladder.mjs
      - name: Compile the 2D game
        if: steps.changed.outputs.build == 'true'
        working-directory: source
        run: |
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git /tmp/raylib
          make -C /tmp/raylib/src PLATFORM=PLATFORM_WEB -j2
          g++ -std=c++17 -I /tmp/raylib/src tests/town-2d-art.cpp -o /tmp/tf-art-test
          /tmp/tf-art-test
          g++ -std=c++17 -I /tmp/raylib/src tests/exterior-mattes.cpp -o /tmp/tf-exterior-mattes
          /tmp/tf-exterior-mattes
          g++ -std=c++17 tests/homestead-life.cpp -o /tmp/tf-homestead-life
          /tmp/tf-homestead-life
          RAYLIB_DIR=/tmp/raylib python tests/avatar-motion.py
          TF_HOMESTEAD_FIXTURE=/tmp/tf-homestead-fixture.txt RAYLIB_DIR=/tmp/raylib python tests/landscape-menus.py
          RAYLIB_DIR=/tmp/raylib TF_VARIANT=2d bash web/build_web.sh
      - name: Preserve online configuration and the games hub
        if: steps.changed.outputs.build == 'true'
        working-directory: source
        run: |
          mkdir -p site
          for file in cloud-config.js mp-config.js; do
            if [ -f "../current-site/$file" ]; then
              cp "../current-site/$file" "site/$file"
            else
              curl --fail --silent "https://ringshark.github.io/townforge-3d-preview/$file" -o "site/$file" || rm -f "site/$file"
            fi
          done
          TF_VARIANT=2d bash web/deploy_web.sh build-web-2d site
          if [ -d ../current-site/games ]; then cp -r ../current-site/games site/games; fi
          git rev-parse HEAD > site/source-version.txt
          touch site/.nojekyll
      - name: Verify desktop and phone rendering
        if: steps.changed.outputs.build == 'true'
        working-directory: source
        run: |
          npm install --prefix /tmp/tf-browser playwright pngjs
          /tmp/tf-browser/node_modules/.bin/playwright install --with-deps chromium webkit
          python3 -m http.server 8765 --directory site > /tmp/tf-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH=/tmp/tf-browser/node_modules node tests/town-2d-web.cjs
          TF_BROWSER=webkit NODE_PATH=/tmp/tf-browser/node_modules node tests/town-2d-web.cjs
          NODE_PATH=/tmp/tf-browser/node_modules node tests/homestead-web.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: townforge-2d-browser-checks
          path: source/browser-checks
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
        if: steps.changed.outputs.build == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.changed.outputs.build == 'true'
        with:
          path: source/site
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.changed.outputs.build == 'true'
